apis:
- name: Sygnum Banking API
  description: >-
    Real-time account and balance retrieval across fiat, digital assets and traditional
    securities held at Sygnum, with role-based permissions, exposed to B2B partners as REST.
  humanURL: https://developer.sygnum.com/banking
  baseURL: https://api.sygnum.com/b2b
  tags:
  - Banking
  - Accounts
  - Balances
  properties:
  - type: Authentication
    url: authentication/sygnum-authentication.yml
- name: Sygnum Trading API
  description: >-
    Order management and execution for Sygnum's digital asset trading service, offered over
    both REST and the FIX protocol, with a webhook channel for asynchronous trade events.
  humanURL: https://developer.sygnum.com/trading
  baseURL: https://api.sygnum.com/b2b
  tags:
  - Trading
  - Orders
  - FIX
  properties:
  - type: FIX
    url: https://developer.sygnum.com/trading/fix
  - type: Webhooks
    url: asyncapi/sygnum-webhooks.yml
- name: Sygnum Custody API
  description: >-
    Endpoint set designed for bank clients to fetch account balances held in Sygnum's
    institutional-grade digital asset custody environment.
  humanURL: https://developer.sygnum.com/custody
  baseURL: https://api.sygnum.com/b2b
  tags:
  - Custody
  - Digital Assets
- name: Sygnum Staking API
  description: >-
    Regulated Ethereum staking for retail and institutional clients — real-time staking,
    automated rewards, flexible amounts and portfolio tracking — with a webhook channel for
    staking lifecycle events.
  humanURL: https://developer.sygnum.com/staking
  baseURL: https://api.sygnum.com/b2b
  tags:
  - Staking
  - Ethereum
  - Rewards
  properties:
  - type: Webhooks
    url: asyncapi/sygnum-webhooks.yml
- name: Sygnum Wallet API
  description: >-
    Wallet service API covering wallet resources attached to Sygnum staking and digital
    asset accounts.
  humanURL: https://developer.sygnum.com/staking/wallet
  baseURL: https://api.sygnum.com/b2b
  tags:
  - Wallet
  - Digital Assets
- name: Sygnum Digital Transfer API
  description: >-
    Digital asset transfer service API for moving assets in and out of Sygnum, with a
    webhook channel for transfer status events.
  humanURL: https://developer.sygnum.com/staking/digital-transfer
  baseURL: https://api.sygnum.com/b2b
  tags:
  - Transfers
  - Digital Assets
  properties:
  - type: Webhooks
    url: asyncapi/sygnum-webhooks.yml
- name: Sygnum Protect API
  description: >-
    API for Sygnum Protect, the bank's off-exchange custody solution that lets exchanges
    verify client collateral held at Sygnum without moving it onto the venue.
  humanURL: https://developer.sygnum.com/protect
  baseURL: https://api.sygnum.com/b2b
  tags:
  - Off-Exchange Custody
  - Collateral
- name: Sygnum Connect API
  description: >-
    API for Sygnum Connect, the bank's 24/7 instant multi-asset settlement network for
    crypto assets, stablecoins and fiat between member institutions.
  humanURL: https://developer.sygnum.com/connect
  baseURL: https://api.sygnum.com/b2b
  tags:
  - Settlement
  - Payments
  - Stablecoins
- name: Sygnum Market Data API
  description: >-
    Market data service exposed as REST plus a streaming WebSocket channel, so partners can
    stream prices and monitor markets inside their own systems.
  humanURL: https://developer.sygnum.com/market-data
  baseURL: https://api.sygnum.com/b2b
  tags:
  - Market Data
  - Streaming
  - WebSocket
  properties:
  - type: WebSocket
    url: https://developer.sygnum.com/market-data/web-socket
- name: Sygnum Access Management API
  description: >-
    Client-management surface of the developer portal — create and manage Auth0 clients,
    attach credentials (public key or certificate with a key identifier and expiry) and
    scope their access to Sygnum APIs.
  humanURL: https://developer.sygnum.com/client-management
  baseURL: https://api.sygnum.com/b2b
  tags:
  - Access Management
  - OAuth
  - Credentials
  properties:
  - type: OAuthScopes
    url: scopes/sygnum-scopes.yml
