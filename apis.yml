aid: sygnum
name: Sygnum
description: >-
  Sygnum is a regulated digital asset banking group, headquartered in Zurich with a
  Singapore arm, that received a Swiss FINMA banking and securities dealer licence in
  August 2019. It provides institutional custody, spot and derivatives trading, staking,
  tokenisation, Lombard lending and 24/7 instant settlement for banks, asset managers,
  exchanges and corporates. Its B2B business is delivered through an API layer published
  at developer.sygnum.com — a catalogue covering Banking, Trading (REST and FIX), Custody,
  Staking, Wallet, Digital Transfer, Sygnum Protect (off-exchange custody), Sygnum Connect
  (instant settlement) and Market Data (REST and WebSocket) — served from the
  api.sygnum.com/b2b gateway and secured with OAuth 2.0 client credentials issued from the
  bank's Auth0 tenant at auth.sygnum.com. The specifications themselves are downloadable
  only to authenticated Sygnum clients from the developer portal.
